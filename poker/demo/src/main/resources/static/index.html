<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker — Mesa</title>
<style>
  :root {
    --felt-1: #1f8a4c; --felt-2: #0e5a30; --felt-3: #073d20;
    --rail: #4a2a14; --rail-hi: #7a4a26; --gold: #e8c46a;
    --card: #fbfaf5; --red: #c8222b; --ink: #15171a;
    --ui: rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at top, #1b1b1f, #0a0a0c);
    color: #f3efe2; font-family: "Trebuchet MS", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 16px; min-height: 100%;
  }
  h1 { margin: 0; font-size: 14px; letter-spacing: .35em; text-transform: uppercase; color: var(--gold); font-weight: 600; }

  .table-wrap { width: min(1000px, 100%); aspect-ratio: 16 / 10; position: relative; }
  .rail {
    position: absolute; inset: 6% 3%;
    border-radius: 50% / 50%;
    background: linear-gradient(160deg, var(--rail-hi), var(--rail) 60%, #2c1608);
    box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 2px 3px rgba(255,255,255,.18);
  }
  .felt {
    position: absolute; inset: 9.5% 5.5%;
    border-radius: 50% / 50%;
    background:
      radial-gradient(ellipse at 50% 40%, var(--felt-1) 0%, var(--felt-2) 60%, var(--felt-3) 100%);
    box-shadow: inset 0 0 70px rgba(0,0,0,.65), inset 0 0 0 3px rgba(0,0,0,.25);
  }
  .felt::before { /* linha decorativa */
    content: ""; position: absolute; inset: 9%; border-radius: 50%/50%;
    border: 2px solid rgba(232,196,106,.35);
  }
  .felt::after { /* textura sutil */
    content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: .18; mix-blend-mode: overlay;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px);
  }

  .center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 2;
  }
  .pot { font-size: 15px; letter-spacing: .08em; background: var(--ui); padding: 6px 16px; border-radius: 999px; border: 1px solid rgba(232,196,106,.4); }
  .pot b { color: var(--gold); font-size: 18px; }
  .phase { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  .board { display: flex; gap: 8px; min-height: 92px; }

  .card {
    width: 58px; height: 84px; background: var(--card); color: var(--ink);
    border-radius: 7px; position: relative; font-weight: 700;
    box-shadow: 0 3px 8px rgba(0,0,0,.45);
    animation: deal .35s ease-out;
  }
  .card.red { color: var(--red); }
  .card .tl { position: absolute; top: 5px; left: 7px; font-size: 16px; line-height: 1; text-align: center; }
  .card .tl i { display: block; font-style: normal; font-size: 13px; }
  .card .big { position: absolute; right: 7px; bottom: 3px; font-size: 30px; }
  .card.back {
    background: repeating-linear-gradient(45deg, #7a1620 0 6px, #5d0f18 6px 12px);
    border: 3px solid var(--card);
  }
  .card.empty { background: rgba(0,0,0,.18); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); animation: none; }
  @keyframes deal { from { transform: translateY(-14px) scale(.9); opacity: 0; } }

  .seat {
    position: absolute; transform: translate(-50%, -50%); z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .seat .hand { display: flex; }
  .seat .hand .card { width: 42px; height: 60px; margin: 0 -6px; }
  .seat .hand .card .tl { font-size: 12px; top: 3px; left: 5px; } .seat .hand .card .tl i { font-size: 10px; }
  .seat .hand .card .big { font-size: 20px; right: 5px; }
  .seat.me .hand .card { width: 58px; height: 84px; margin: 0 -4px; }
  .seat.me .hand .card .tl { font-size: 16px; top: 5px; left: 7px; } .seat.me .hand .card .tl i { font-size: 13px; }
  .seat.me .hand .card .big { font-size: 30px; }
  .plate {
    background: var(--ui); border: 1px solid rgba(255,255,255,.15); border-radius: 12px;
    padding: 5px 14px; text-align: center; min-width: 96px; backdrop-filter: blur(2px);
  }
  .plate .name { font-size: 13px; font-weight: 700; }
  .plate .chips { font-size: 12px; color: var(--gold); }
  .seat.folded { opacity: .4; }
  .seat.winner .plate { border-color: var(--gold); box-shadow: 0 0 18px rgba(232,196,106,.8); }
  .tag { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: #fff; background: #b8861b; border-radius: 4px; padding: 1px 6px; }
  .bet { font-size: 12px; background: #1a1a1a; border: 2px dashed var(--gold); border-radius: 999px; padding: 2px 10px; color: var(--gold); }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: 700; letter-spacing: .05em; cursor: pointer;
    border: 0; border-radius: 10px; padding: 12px 22px; color: #fff;
    background: #2a2d33; box-shadow: 0 3px 0 #111;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #111; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .b-fold { background: #8b2330; } .b-call { background: #1f7a45; } .b-raise { background: #b8861b; } .b-new { background: #3a4a8a; }
  input[type=number] { width: 90px; padding: 11px; border-radius: 10px; border: 0; font: inherit; font-weight: 700; text-align: center; }
  .msg { min-height: 24px; color: var(--gold); font-size: 15px; text-align: center; }

  @media (max-width: 640px) {
    .card { width: 40px; height: 58px; } .card .big { font-size: 20px; } .card .tl { font-size: 12px; } .card .tl i { font-size: 10px; }
    .board { min-height: 58px; gap: 4px; }
    .seat .hand .card { width: 28px; height: 40px; } .seat.me .hand .card { width: 40px; height: 58px; }
    .plate { min-width: 64px; padding: 3px 6px; } .plate .name { font-size: 11px; } .plate .chips { font-size: 10px; }
    .bet { font-size: 10px; }
  }
</style>
</head>
<body>
  <h1>Texas Hold'em</h1>

  <div class="table-wrap">
    <div class="rail"></div>
    <div class="felt"></div>
    <div class="center">
      <div class="phase" id="fase"></div>
      <div class="board" id="board"></div>
      <div class="pot">Pote <b id="pote">0</b></div>
    </div>
    <div id="seats"></div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="controls">
    <button class="b-fold" id="bDesistir">Desistir</button>
    <button class="b-call" id="bIgualar">Passar / Pagar</button>
    <input type="number" id="valor" min="10" step="10" value="50" aria-label="Valor do aumento">
    <button class="b-raise" id="bAumentar">Aumentar</button>
    <button class="b-new" id="bNova">Nova mão</button>
  </div>

<script>
// Posições dos assentos (% do container). Índice 0 = jogador humano (embaixo).
const POS = [[50, 88], [14, 70], [14, 30], [50, 12], [86, 30], [86, 70]];
const $ = id => document.getElementById(id);
const FASES = { PRE_FLOP: "Pré-flop", FLOP: "Flop", TURN: "Turn", RIVER: "River", SHOWDOWN: "Showdown" };

function cartaEl(c) {
  const d = document.createElement("div");
  if (!c) { d.className = "card back"; return d; }
  d.className = "card" + (c.vermelho ? " red" : "");
  d.innerHTML = `<div class="tl">${c.rotulo}<i>${c.simbolo}</i></div><div class="big">${c.simbolo}</div>`;
  return d;
}

function render(e) {
  $("fase").textContent = FASES[e.fase] || e.fase;
  $("pote").textContent = e.pote;

  const board = $("board"); board.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    if (e.comunitarias[i]) board.appendChild(cartaEl(e.comunitarias[i]));
    else { const v = document.createElement("div"); v.className = "card empty"; board.appendChild(v); }
  }

  const seats = $("seats"); seats.innerHTML = "";
  e.jogadores.forEach((j, i) => {
    const s = document.createElement("div");
    s.className = "seat" + (j.humano ? " me" : "") + (j.desistiu ? " folded" : "") +
                  (!e.maoEmAndamento && e.vencedores.includes(j.nome) ? " winner" : "");
    s.style.left = POS[i][0] + "%"; s.style.top = POS[i][1] + "%";
    const hand = document.createElement("div"); hand.className = "hand";
    j.cartas.forEach(c => hand.appendChild(cartaEl(c)));
    s.appendChild(hand);
    const plate = document.createElement("div"); plate.className = "plate";
    plate.innerHTML = `<div class="name">${j.nome}</div><div class="chips">${j.fichas} fichas${j.allIn ? " · ALL-IN" : ""}</div>`;
    s.appendChild(plate);
    if (j.aposta > 0) { const b = document.createElement("div"); b.className = "bet"; b.textContent = j.aposta; s.appendChild(b); }
    seats.appendChild(s);
  });

  const eu = e.jogadores[0];
  const ativo = e.maoEmAndamento && !eu.desistiu;
  ["bDesistir", "bIgualar", "bAumentar"].forEach(id => $(id).disabled = !ativo);
  $("valor").disabled = !ativo;
  $("bNova").disabled = e.maoEmAndamento;
  $("valor").max = eu.fichas;

  if (!e.maoEmAndamento && e.vencedores.length) {
    $("msg").textContent = `🏆 ${e.vencedores.join(" e ")} ${e.vencedores.length > 1 ? "dividem o pote" : "leva o pote"} — ${e.descricaoVencedora}`;
  } else if (!e.maoEmAndamento) {
    $("msg").textContent = "Fichas insuficientes para uma nova mão.";
  } else {
    $("msg").textContent = "";
  }
}

async function chamar(url, opts) {
  const r = await fetch(url, opts);
  const dados = await r.json();
  if (!r.ok) { $("msg").textContent = dados.erro || "Erro"; return; }
  render(dados);
}
const acao = (a, v = 0) => chamar("/api/mesa/acao", {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ acao: a, valor: v })
});

$("bDesistir").onclick = () => acao("desistir");
$("bIgualar").onclick = () => acao("igualar");
$("bAumentar").onclick = () => acao("aumentar", parseInt($("valor").value, 10) || 0);
$("bNova").onclick = () => chamar("/api/mesa/nova-mao", { method: "POST" });
chamar("/api/mesa");
</script>
</body>
</html>
